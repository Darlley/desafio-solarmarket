version: '3.3'

services:
  mysql:
    image: mysql:5.7
    container_name: solarmarket_mysql
    restart: no
    env_file:
      - .env
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    container_name: solarmarket_adminer
    restart: "no"
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data: